<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#pbg)" />

  <!-- Browser window chrome -->
  <rect x="100" y="60" width="600" height="380" rx="16" fill="#0b1329" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2" />
  
  <!-- Window top bar -->
  <rect x="100" y="60" width="600" height="42" rx="16" fill="#131d36" />
  <circle cx="125" cy="81" r="5" fill="#ef4444" />
  <circle cx="143" cy="81" r="5" fill="#f59e0b" />
  <circle cx="161" cy="81" r="5" fill="#10b981" />
  <rect x="220" y="71" width="360" height="20" rx="6" fill="#090e1a" />
  <text x="400" y="85" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">nadunnethsara.github.io/portfolio</text>

  <!-- Hero Content inside browser -->
  <text x="140" y="160" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">HI, I'M</text>
  <text x="140" y="200" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="32" font-weight="800">Nadun Nethsara</text>
  <text x="140" y="235" fill="url(#headerGrad)" font-family="-apple-system, sans-serif" font-size="20" font-weight="700">Software Engineer | Mobile Developer</text>
  
  <text x="140" y="275" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" width="300">
    Passionate IT undergraduate specializing in modern full-stack web
  </text>
  <text x="140" y="295" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">
    and mobile applications with Flutter, React, and IoT integrations.
  </text>

  <!-- Buttons -->
  <rect x="140" y="330" width="130" height="36" rx="8" fill="#2563eb" />
  <text x="205" y="353" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">View Projects</text>

  <rect x="285" y="330" width="120" height="36" rx="8" fill="transparent" stroke="#38bdf8" stroke-width="1.5" />
  <text x="345" y="353" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Download CV</text>

  <!-- Avatar card illustration -->
  <circle cx="560" cy="240" r="85" fill="#162340" stroke="url(#headerGrad)" stroke-width="3" />
  <circle cx="560" cy="210" r="32" fill="#38bdf8" opacity="0.8" />
  <path d="M 505 295 A 55 55 0 0 1 615 295 Z" fill="#38bdf8" opacity="0.8" />
</svg>