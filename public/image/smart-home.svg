<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e1a" />
      <stop offset="50%" stop-color="#0f1b35" />
      <stop offset="100%" stop-color="#0a1226" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162340" />
      <stop offset="100%" stop-color="#0e172a" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)" />

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Central Dashboard Panel -->
  <rect x="120" y="70" width="560" height="360" rx="16" fill="url(#cardGrad)" stroke="rgba(37, 99, 235, 0.3)" stroke-width="2" />

  <!-- Top bar -->
  <rect x="120" y="70" width="560" height="48" rx="16" fill="#131d36" />
  <circle cx="150" cy="94" r="6" fill="#ef4444" />
  <circle cx="170" cy="94" r="6" fill="#f59e0b" />
  <circle cx="190" cy="94" r="6" fill="#10b981" />
  <text x="400" y="99" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">ATmega32 Smart Home Automation System</text>

  <!-- Sensor Node Cards -->
  <!-- 1. Temperature -->
  <rect x="150" y="145" width="230" height="110" rx="12" fill="#0b1329" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  <text x="175" y="175" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">🌡️ Temperature Sensor</text>
  <text x="175" y="215" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="28" font-weight="800">26.4 °C</text>
  <text x="175" y="238" fill="#10b981" font-family="-apple-system, sans-serif" font-size="12">● Normal Threshold</text>

  <!-- 2. Gas Leakage -->
  <rect x="410" y="145" width="230" height="110" rx="12" fill="#0b1329" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  <text x="435" y="175" fill="#06b6d4" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">💨 Gas / Smoke (MQ-2)</text>
  <text x="435" y="215" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="28" font-weight="800">142 PPM</text>
  <text x="435" y="238" fill="#10b981" font-family="-apple-system, sans-serif" font-size="12">● Safe Environment</text>

  <!-- 3. Humidity & Light -->
  <rect x="150" y="275" width="230" height="120" rx="12" fill="#0b1329" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  <text x="175" y="305" fill="#3b82f6" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">💧 Humidity & LDR</text>
  <text x="175" y="345" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="24" font-weight="800">62% | 840 Lux</text>
  <text x="175" y="372" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Auto Day/Night Detection</text>

  <!-- 4. Actuators & Relay Status -->
  <rect x="410" y="275" width="230" height="120" rx="12" fill="#0b1329" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  <text x="435" y="305" fill="#a855f7" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">⚙️ Actuators & Relays</text>
  <text x="435" y="340" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">Fan: <tspan fill="#10b981">ON (Auto)</tspan> | LEDs: <tspan fill="#10b981">ACTIVE</tspan></text>
  <text x="435" y="365" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">Emergency Buzzer: <tspan fill="#64748b">STANDBY</tspan></text>
  <text x="435" y="388" fill="#06b6d4" font-family="-apple-system, sans-serif" font-size="11">Proteus Simulation & C Logic</text>
</svg>